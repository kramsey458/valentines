<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine</title>
  <style>
    :root {
      color-scheme: light;
      --pink: #ff7eb6;
      --pink-dark: #ff4f95;
      --red: #ff4d6d;
      --peach: #ffd6e8;
      --cream: #fff5f7;
      --text: #5c2a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #fff, var(--peach));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: var(--text);
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 36px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 18px 45px rgba(255, 77, 109, 0.18);
      text-align: center;
      border: 3px solid rgba(255, 79, 149, 0.2);
    }

    .hearts {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 24px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      position: relative;
      min-height: 80px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .yes {
      background: linear-gradient(135deg, var(--pink), var(--red));
      color: #fff;
      box-shadow: 0 12px 20px rgba(255, 79, 149, 0.35);
      position: relative;
      z-index: 2;
    }

    .yes:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 25px rgba(255, 79, 149, 0.4);
    }

    .no {
      background: var(--cream);
      color: var(--text);
      border: 2px dashed rgba(255, 79, 149, 0.4);
      transition: transform 0.25s ease, box-shadow 0.2s ease;
      will-change: transform;
    }

    .no:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 15px rgba(92, 42, 74, 0.1);
    }

    .message {
      margin-top: 24px;
      background: #fff0f6;
      padding: 16px 20px;
      border-radius: 18px;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 16px;
    }

    .message.show {
      display: inline-block;
      animation: pop 0.4s ease;
    }

    .yes-toggle {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .yes-toggle:checked ~ .message {
      display: inline-flex;
      animation: pop 0.4s ease;
    }

    .heart-animation {
      width: 96px;
      height: 96px;
      position: relative;
      flex-shrink: 0;
    }

    .heart-animation svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .heart-outline {
      fill: none;
      stroke: var(--pink-dark);
      stroke-width: 8;
    }

    .heart-fill {
      fill: url(#heartGradient);
      transform-origin: center bottom;
      transform: scaleY(0);
    }

    .yes-toggle:checked ~ .message .heart-fill {
      animation: fillUp 1.2s ease forwards;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
    }

    .yes-toggle:checked ~ .message .sparkles {
      animation: sparkles 1.1s ease 0.1s forwards;
    }

    .sparkles span {
      position: absolute;
      font-size: 20px;
      opacity: 0;
      animation: sparkleFloat 1.2s ease forwards;
    }

    .sparkles span:nth-child(1) {
      transform: translate(-36px, -20px);
      animation-delay: 0.1s;
    }

    .sparkles span:nth-child(2) {
      transform: translate(32px, -28px);
      animation-delay: 0.2s;
    }

    .sparkles span:nth-child(3) {
      transform: translate(-24px, 30px);
      animation-delay: 0.3s;
    }

    .sparkles span:nth-child(4) {
      transform: translate(28px, 26px);
      animation-delay: 0.4s;
    }

    .note {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #9a5b7d;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fillUp {
      0% {
        transform: scaleY(0);
      }
      60% {
        transform: scaleY(1.05);
      }
      100% {
        transform: scaleY(1);
      }
    }

    @keyframes sparkles {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes sparkleFloat {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.6);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(0, -12px) scale(1.1);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="hearts">💖 💘 💝</div>
    <h1>Will you be my Valentine, Sarah?</h1>
    <p>pls pls pls</p>

    <input class="yes-toggle" type="checkbox" id="yes-toggle" />
    <div class="buttons">
      <label class="yes" for="yes-toggle">yes :)</label>
      <button class="no" type="button">no :(</button>
    </div>

    <div class="message" id="message">
      <div class="heart-animation">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="heartGradient" x1="0" x2="0" y1="1" y2="0">
              <stop offset="0%" stop-color="#ff4d6d" />
              <stop offset="100%" stop-color="#ff7eb6" />
            </linearGradient>
            <clipPath id="heartClip">
              <path d="M60 104C60 104 20 76 20 46C20 28 35 16 50 16C60 16 66 22 60 30C54 22 60 16 70 16C85 16 100 28 100 46C100 76 60 104 60 104Z" />
            </clipPath>
          </defs>
          <path class="heart-fill" clip-path="url(#heartClip)" d="M60 104C60 104 20 76 20 46C20 28 35 16 50 16C60 16 66 22 60 30C54 22 60 16 70 16C85 16 100 28 100 46C100 76 60 104 60 104Z" />
          <path class="heart-outline" d="M60 104C60 104 20 76 20 46C20 28 35 16 50 16C60 16 66 22 60 30C54 22 60 16 70 16C85 16 100 28 100 46C100 76 60 104 60 104Z" />
        </svg>
        <div class="sparkles" aria-hidden="true">
          <span>💗</span>
          <span>💖</span>
          <span>💘</span>
          <span>💝</span>
        </div>
      </div>
      <div class="message-text">You filled my heart! 💞</div>
    </div>
  </main>
</body>
</html>
