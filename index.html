<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine</title>
  <style>
    :root {
      color-scheme: light;
      --pink: #ff7eb6;
      --pink-dark: #ff4f95;
      --red: #ff4d6d;
      --peach: #ffd6e8;
      --cream: #fff5f7;
      --text: #5c2a4a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #fff, var(--peach));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      color: var(--text);
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: 36px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 18px 45px rgba(255, 77, 109, 0.18);
      text-align: center;
      border: 3px solid rgba(255, 79, 149, 0.2);
    }

    .hearts {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 16px;
      font-size: 24px;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      font-size: 2rem;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    p {
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      position: relative;
      min-height: 80px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .yes {
      background: linear-gradient(135deg, var(--pink), var(--red));
      color: #fff;
      box-shadow: 0 12px 20px rgba(255, 79, 149, 0.35);
      position: relative;
      z-index: 2;
    }

    .yes:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 16px 25px rgba(255, 79, 149, 0.4);
    }

    .no {
      background: var(--cream);
      color: var(--text);
      border: 2px dashed rgba(255, 79, 149, 0.4);
      transition: transform 0.25s ease, box-shadow 0.2s ease;
      will-change: transform;
    }

    .no:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 15px rgba(92, 42, 74, 0.1);
    }

    .message {
      margin-top: 24px;
      background: #fff0f6;
      padding: 16px 20px;
      border-radius: 18px;
      font-weight: 600;
      display: none;
    }

    .message.show {
      display: inline-block;
      animation: pop 0.4s ease;
    }

    .note {
      margin-top: 18px;
      font-size: 0.9rem;
      color: #9a5b7d;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes pop {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="hearts">💖 💘 💝</div>
    <h1>Will you be my Valentine, Sarah?</h1>
    <p>pls pls pls</p>

    <div class="buttons">
      <button class="yes" type="button">yes :)</button>
      <button class="no" type="button">no :(</button>
    </div>

    <div class="message" id="message"></div>
  </main>

  <script>
    const yesButton = document.querySelector(".yes");
    const noButton = document.querySelector(".no");
    const message = document.getElementById("message");

    const yesMessages = [
      "i love you so much sarawr xD",
      "i shake my butt excitedly in a happy dance because i love you so much",
      "i love you and your spoon hands"
    ];

    const noMessages = [
      "do you even like me?",
      "i will tickle you for clicking this",
      "stop you don't actually mean this"
    ];

    const chaosSettings = {
      maxTranslateX: 140,
      maxTranslateY: 90,
      minScale: 0.95,
      maxScale: 1.05,
      maxRotate: 10,
      cooldownMs: 180
    };

    let lastMoveAt = 0;

    const moveNoButton = () => {
      const now = Date.now();
      if (now - lastMoveAt < chaosSettings.cooldownMs) {
        return;
      }
      lastMoveAt = now;

      const x = Math.floor(Math.random() * (chaosSettings.maxTranslateX * 2 + 1)) - chaosSettings.maxTranslateX;
      const y = Math.floor(Math.random() * (chaosSettings.maxTranslateY * 2 + 1)) - chaosSettings.maxTranslateY;
      const rotation = (Math.random() * chaosSettings.maxRotate * 2) - chaosSettings.maxRotate;
      const scale = chaosSettings.minScale + Math.random() * (chaosSettings.maxScale - chaosSettings.minScale);

      noButton.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg) scale(${scale})`;
    };

    const moveAwayFromPointer = (event) => {
      const rect = noButton.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const distance = Math.hypot(event.clientX - centerX, event.clientY - centerY);

      if (distance < 90) {
        moveNoButton();
      }
    };

    yesButton.addEventListener("click", () => {
      const random = yesMessages[Math.floor(Math.random() * yesMessages.length)];
      message.textContent = random;
      message.classList.add("show");
    });

    ["mouseenter", "focus", "touchstart", "pointerdown"].forEach((eventName) => {
      noButton.addEventListener(eventName, (event) => {
        event.preventDefault();
        moveNoButton();
      });
    });

    document.addEventListener("mousemove", moveAwayFromPointer);
    window.addEventListener("resize", moveNoButton);

    noButton.addEventListener("click", () => {
      const random = noMessages[Math.floor(Math.random() * noMessages.length)];
      message.textContent = random;
      message.classList.add("show");
    });
  </script>
</body>
</html>
